<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#090b14"/>
      <stop offset="100%" stop-color="#160d2b"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="grad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Page Background with subtle paper tone -->
  <rect width="1200" height="1600" fill="url(#bgGrad)"/>
  
  <!-- Outer Comic Page Frame / Gutter -->
  <rect x="25" y="25" width="1150" height="1550" rx="24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
  <rect x="40" y="40" width="1120" height="1520" rx="16" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Comic Header Header Bar -->
  <g transform="translate(60, 60)">
    <text x="0" y="40" font-family="'Impact', 'Segoe UI Black', sans-serif" font-size="34" fill="#7C3AED" letter-spacing="3">CHAPTER 1 — THE BEGINNING</text>
    <text x="1080" y="40" text-anchor="end" font-family="'Segoe UI Black', sans-serif" font-size="24" fill="#00E5FF">PAGE 3 / 4</text>
    <line x1="0" y1="60" x2="1080" y2="60" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  </g>

  
      <!-- Panel 1 -->
      <g transform="translate(60, 160)">
        <rect width="1080" height="420" rx="16" fill="#160d2b" stroke="#7C3AED" stroke-width="3" stroke-opacity="0.5"/>
        <rect width="1080" height="420" rx="16" fill="url(#grad1)" opacity="0.3"/>
        <path d="M 0 350 Q 540 100 1080 350" fill="none" stroke="#7C3AED" stroke-width="4" opacity="0.4"/>
        <rect x="30" y="30" width="480" height="70" rx="10" fill="#080b13" stroke="#7C3AED" stroke-width="2"/>
        <text x="50" y="60" font-family="'Impact', 'Segoe UI Black', sans-serif" font-size="22" fill="#7C3AED" letter-spacing="2">SHADOWED RIVAL</text>
        <text x="50" y="84" font-family="system-ui, sans-serif" font-size="14" fill="#F3F4F6" opacity="0.85">High-frequency blade humming with electric menace.</text>
      </g>
      <!-- Panel 2 -->
      <g transform="translate(60, 610)">
        <rect width="520" height="420" rx="16" fill="#160d2b" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.5"/>
        <circle cx="260" cy="210" r="120" fill="#00E5FF" opacity="0.1" filter="url(#blurGlow)"/>
        <rect x="25" y="25" width="460" height="75" rx="10" fill="#080b13" stroke="#00E5FF" stroke-width="2"/>
        <text x="40" y="55" font-family="'Impact', sans-serif" font-size="20" fill="#00E5FF" letter-spacing="1.5">ENGAGEMENT</text>
        <text x="40" y="80" font-family="system-ui, sans-serif" font-size="13" fill="#F3F4F6" opacity="0.85">"You should have left the core where you found it."</text>
      </g>
      <!-- Panel 3 -->
      <g transform="translate(620, 610)">
        <rect width="520" height="420" rx="16" fill="#160d2b" stroke="#7C3AED" stroke-width="3" stroke-opacity="0.5"/>
        <line x1="20" y1="20" x2="500" y2="400" stroke="#7C3AED" stroke-width="2" opacity="0.3"/>
        <rect x="25" y="25" width="460" height="75" rx="10" fill="#080b13" stroke="#7C3AED" stroke-width="2"/>
        <text x="40" y="55" font-family="'Impact', sans-serif" font-size="20" fill="#7C3AED" letter-spacing="1.5">ESCAPE VECTOR</text>
        <text x="40" y="80" font-family="system-ui, sans-serif" font-size="13" fill="#F3F4F6" opacity="0.85">Smoke grenade detonates — blinding ultraviolet flash!</text>
      </g>
      <!-- Panel 4 Bottom Narrative banner -->
      <g transform="translate(60, 1060)">
        <rect width="1080" height="400" rx="16" fill="#160d2b" stroke="#00E5FF" stroke-width="4" stroke-opacity="0.6"/>
        <rect width="1080" height="400" rx="16" fill="url(#grad2)" opacity="0.3"/>
        <circle cx="850" cy="200" r="160" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 12" opacity="0.4"/>
        <rect x="80" y="100" width="920" height="180" rx="20" fill="#ffffff" stroke="#111827" stroke-width="4"/>
        <text x="120" y="160" font-family="'Segoe UI Black', sans-serif" font-size="28" fill="#111827" letter-spacing="1">CONTACT</text>
        <text x="120" y="210" font-family="system-ui, sans-serif" font-size="20" fill="#4B5563" font-weight="600">A shadowed figure steps through holographic steam.</text>
      </g>
    

  <!-- Page Footer -->
  <g transform="translate(60, 1530)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="0" y="30" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.5)" letter-spacing="1">FYP IMMERSIVE READER • 3D PHYSICAL BOOK EDITION</text>
    <text x="1080" y="30" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" fill="#7C3AED" font-weight="bold">CHAPTER 1 · PAGE 3</text>
  </g>
</svg>