<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <radialGradient id="v" cx="25%" cy="20%" r="75%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a" cx="80%" cy="35%" r="75%">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#v)"/>
  <rect width="1600" height="900" fill="url(#a)"/>

  <!-- comic panels -->
  <g fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.12)" stroke-width="4">
    <rect x="80" y="70" width="420" height="260" rx="26"/>
    <rect x="540" y="70" width="480" height="170" rx="26"/>
    <rect x="1050" y="70" width="470" height="260" rx="26"/>

    <rect x="540" y="270" width="480" height="260" rx="26"/>
    <rect x="80" y="360" width="420" height="170" rx="26"/>
    <rect x="1050" y="360" width="470" height="170" rx="26"/>

    <rect x="80" y="560" width="660" height="270" rx="26"/>
    <rect x="780" y="560" width="740" height="270" rx="26"/>
  </g>

  <!-- subtle halftone -->
  <g opacity="0.12" fill="#F9FAFB">
    <circle cx="300" cy="180" r="2"/>
    <circle cx="320" cy="190" r="2"/>
    <circle cx="340" cy="200" r="2"/>
    <circle cx="360" cy="210" r="2"/>
    <circle cx="380" cy="220" r="2"/>
    <circle cx="400" cy="230" r="2"/>
  </g>

  <text x="120" y="860" font-size="24" font-family="system-ui, sans-serif" fill="rgba(249,250,251,0.18)">FYP</text>
</svg>

